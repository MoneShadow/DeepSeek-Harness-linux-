<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; frame-src http://127.0.0.1:*; img-src 'self' data: http://127.0.0.1:*" />
  <title>DSH Desktop</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header id="titlebar">
    <span class="logo">🐳</span>
    <span class="app-name">DSH Desktop</span>
    <span class="app-ver" id="app-ver"></span>
    <span class="titlebar-spacer"></span>
    <button id="btn-settings" title="设置">⚙ 设置</button>
  </header>

  <!-- 设置面板 -->
  <div id="settings-panel" hidden>
    <div class="panel-head">
      <span>设置</span>
      <button id="btn-close-settings" title="关闭">✕</button>
    </div>
    <div class="panel-body">
      <section class="upd-section">
        <h3>DeepSeek Harness 更新</h3>
        <div class="row"><span>当前版本</span><span id="upd-current">—</span></div>
        <div class="row"><span>最新版本</span><span id="upd-latest">—</span></div>
        <div class="row actions">
          <button id="btn-check-update">检查更新</button>
          <button id="btn-install-update" class="primary" disabled>立即更新</button>
        </div>
        <div id="upd-message" class="message"></div>
        <div class="row toggles">
          <label><input type="checkbox" id="chk-auto-check" /> 启动时自动检查更新（每 6 小时）</label>
        </div>
        <div class="row toggles">
          <label><input type="checkbox" id="chk-auto-install" /> 发现新版本自动安装</label>
        </div>
        <div class="row">
          <span>更新通道</span>
          <select id="sel-channel" title="npm 标签：next=预览版（默认），latest=稳定版">
            <option value="next">next（预览版）</option>
            <option value="latest">latest（稳定版）</option>
          </select>
        </div>
      </section>
      <section class="log-section">
        <h3>引擎日志</h3>
        <pre id="web-log" class="log-box"></pre>
        <div class="row actions">
          <button id="btn-refresh-log">刷新</button>
        </div>
      </section>
      <section class="about">
        <h3>关于</h3>
        <div class="row"><span>应用版本</span><span id="about-app-ver">—</span></div>
        <div class="row"><span>dsh 路径</span><span id="about-dsh-path">—</span></div>
      </section>
    </div>
  </div>

  <!-- 更新提示横幅 -->
  <div id="update-banner" hidden>
    <span id="banner-text"></span>
    <button id="banner-open">查看</button>
  </div>

  <!-- 官方 Web UI -->
  <main id="web-pane">
    <iframe id="web-frame" title="DSH Web UI"></iframe>
    <div id="web-loading">
      <span class="logo">🐳</span>
      <div class="spinner"></div>
      <div id="loading-status">正在启动 DSH Web 服务…</div>
      <button id="btn-retry" hidden>重新连接</button>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
